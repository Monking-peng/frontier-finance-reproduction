name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install pinned environment
        run: uv sync --locked --python 3.13
      - name: Unit tests
        run: uv run pytest -q
      - name: Static checks
        run: uv run ruff check .
      - name: Validate JavaScript syntax
        run: node --check docs/app.js
      - name: Validate JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("docs/data").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

